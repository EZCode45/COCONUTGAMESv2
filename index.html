<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COCONUT Games</title>
  <link rel="stylesheet" href="css/fontawesome.css"/>
  <link rel="stylesheet" href="css/index.css"/>
</head>
<body>
  <video id="camstatic" preload="auto" muted style="display: none;">
    <source src="img/camstatic.mp4" type="video/mp4">
  </video>

  <canvas id="matrix"></canvas>
  <div id="overlay"></div>
  <div id="overlaygreen1"></div>
  <div id="overlaygreen2"></div>

  <main class="app-shell">
    <header class="hero">
      <p class="badge">COCONUT</p>
      <h1>COCONUT Games</h1>
      <h2>Clean, smooth, no-noise game launcher</h2>
    </header>

    <section class="content-card">
      <iframe src="pages/lessons/lessons.html" id="pageiframe" title="Games"></iframe>
    </section>
  </main>
</body>
<script>
  (function () {
    if (window.top !== window.self) return;
    if (sessionStorage.getItem('coconut_cloaked') === '1') return;
    const target = window.location.href;
    const win = window.open('about:blank', '_blank');
    if (!win) return;
    win.document.open();
    win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Classes</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#000;}</style></head><body><iframe allowfullscreen referrerpolicy="no-referrer" src=\"' + target + '\"></iframe></body></html>');
    win.document.close();
    sessionStorage.setItem('coconut_cloaked', '1');
    window.location.replace('https://www.google.com');
  })();
</script>
</html>
