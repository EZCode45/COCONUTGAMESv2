
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07150f">
<title>COCONUT | Games Library</title>

<style>
:root {
  color-scheme: dark;
  --bg: #07150f;
  --panel: #0d2118;
  --hover: #153526;
  --text: #e6fff0;
  --muted: #91b6a0;
  --accent: #65f0a8;
  --border: #244735;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}

button, input, select { font: inherit; }

button {
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 13px;
  cursor: pointer;
}

button:hover {
  background: var(--hover);
  border-color: var(--accent);
}

header {
  padding: 35px 18px 20px;
  text-align: center;
}

.brand {
  color: var(--accent);
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 5px;
}

h1 {
  margin: 12px 0 8px;
  font-size: clamp(28px, 5vw, 44px);
}

header p { color: var(--muted); margin: 0; }

main {
  width: min(1150px, 94%);
  margin: auto;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 24px 0 12px;
}

input, select {
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
}

input { flex: 1; }

#count {
  margin: 16px 2px;
  color: var(--muted);
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 15px;
  padding-bottom: 45px;
}

.game {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--panel);
  transition: transform .15s, background .15s, border-color .15s;
}

.game:hover {
  transform: translateY(-3px);
  background: var(--hover);
  border-color: var(--accent);
}

.game h2 {
  margin: 0 0 6px;
  font-size: 17px;
  overflow-wrap: anywhere;
}

.game p {
  min-height: 35px;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.icon {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin-bottom: 14px;
  overflow: hidden;
  border-radius: 17px;
  background: linear-gradient(135deg, #1d6644, #18372a);
  color: #c0ffda;
  font-size: 25px;
  font-weight: 900;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.game-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.game-actions button {
  padding: 8px 10px;
  font-size: 12px;
}

.empty {
  grid-column: 1 / -1;
  padding: 40px 15px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 15px;
}

/* Full-screen game player */

#player[hidden],
#panicOverlay[hidden] {
  display: none !important;
}

#player {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.player-bar {
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.player-bar strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#gameFrame {
  flex: 1;
  width: 100%;
  min-height: 0;
  border: 0;
  background: #000;
}

/* Panic overlay */

#panicOverlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #fff;
}

#panicFrame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

footer {
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 520px) {
  .controls > * { width: 100%; }
  .player-bar { flex-wrap: wrap; }
  .player-bar strong { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<body>

<header>
  <div class="brand">COCONUT</div>
  <h1>Games Library</h1>
  <p>Find a game and start playing.</p>
</header>

<main>
  <div class="controls">
    <input
      id="search"
      type="search"
      placeholder="Search games..."
      autocomplete="off"
      aria-label="Search games"
    >

    <select id="category" aria-label="Filter by category">
      <option value="">All categories</option>
    </select>

    <select id="sort" aria-label="Sort games">
      <option value="featured">Featured order</option>
      <option value="az">Name: A–Z</option>
      <option value="za">Name: Z–A</option>
    </select>
  </div>

  <div id="count" aria-live="polite"></div>
  <section id="games" class="grid" aria-label="Game library"></section>

  <!-- Full-screen game player -->
  <div id="player" hidden>
    <div class="player-bar">
      <button id="backButton">← Back to games</button>
      <strong id="playingTitle">Playing</strong>
      <button id="newTabButton">Open in about:blank</button>
    </div>

    <iframe
      id="gameFrame"
      title="Game player"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
    ></iframe>
  </div>
</main>

<!-- Configurable panic overlay -->
<div id="panicOverlay" hidden>
  <iframe id="panicFrame" title="Panic page"></iframe>
</div>

<footer>COCONUT • Games Library</footer>

<script>
"use strict";

/*
  GAME CATALOG

  Every path is relative to this HTML file.
  For example:
    public/lessons.html
    public/games/slope/index.html

  Use path: "games/slope/" for that game.

  icon is optional. If omitted, an icon is generated
  automatically from the game's initials.
*/

const gameList = [
  {
    name: "Example Arcade Game",
    category: "Arcade",
    path: "games/example-game/",
    icon: "",
    description: "Replace this with your game."
  },
  {
    name: "Example Puzzle",
    category: "Puzzle",
    path: "games/example-puzzle/",
    icon: "",
    description: "A puzzle game."
  },
  {
    name: "Example Learning Game",
    category: "Learning",
    path: "games/example-learning/",
    icon: "",
    description: "Learn while you play."
  }
];

/*
  PANIC CONFIGURATION

  Set this to the website you want the panic overlay
  to display. Some websites block iframe embedding.

  The backtick key (usually below Escape) activates it.
  Escape dismisses it.
*/

const PANIC_SITE = "https://www.google.com";
const PANIC_KEY = "`";

/* DOM references */

const search = document.getElementById("search");
const category = document.getElementById("category");
const sort = document.getElementById("sort");
const grid = document.getElementById("games");
const count = document.getElementById("count");

const player = document.getElementById("player");
const gameFrame = document.getElementById("gameFrame");
const playingTitle = document.getElementById("playingTitle");

const panicOverlay = document.getElementById("panicOverlay");
const panicFrame = document.getElementById("panicFrame");

let currentGame = null;

/* Generate icons from game names */

function makeInitials(name) {
  return name
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(word => word[0] || "")
    .join("")
    .toUpperCase();
}

/* Create categories automatically */

function createCategories() {
  const categories = [
    ...new Set(gameList.map(game => game.category || "Other"))
  ].sort((a, b) => a.localeCompare(b));

  for (const name of categories) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    category.appendChild(option);
  }
}

/* Resolve a game URL */

function getGameURL(game) {
  return new URL(game.path, document.baseURI).href;
}

/* Open game in the on-page iframe */

function openGame(game) {
  try {
    const url = getGameURL(game);

    if (!["http:", "https:"].includes(new URL(url).protocol)) {
      return;
    }

    currentGame = game;
    playingTitle.textContent = game.name;
    player.hidden = false;
    document.body.style.overflow = "hidden";
    gameFrame.src = url;
  } catch (error) {
    console.error("Could not open game:", error);
  }
}

/* Close the game player */

function closeGame() {
  gameFrame.src = "about:blank";
  player.hidden = true;
  document.body.style.overflow = "";
  currentGame = null;
}

/*
  Open the game inside a newly created about:blank tab.
  The tab is created directly from the user's button click
  to reduce the chance of the browser blocking the popup.
*/

function openGameInBlankTab(game) {
  let url;

  try {
    url = getGameURL(game);
  } catch {
    alert("This game's URL is invalid.");
    return;
  }

  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    alert("Pop-ups are blocked. Allow pop-ups for this site and try again.");
    return;
  }

  try {
    const doc = tab.document;
    doc.title = game.name;
    doc.body.style.cssText = "margin:0;overflow:hidden";

    const frame = doc.createElement("iframe");
    frame.title = game.name;
    frame.src = url;
    frame.allow = "fullscreen; autoplay; gamepad";
    frame.allowFullscreen = true;
    frame.style.cssText =
      "position:fixed;inset:0;width:100%;height:100%;border:0";

    doc.body.appendChild(frame);
  } catch (error) {
    console.error("Could not prepare blank tab:", error);
    tab.location.href = url;
  }
}

/* Render the game library */

function renderGames() {
  const query = search.value.trim().toLowerCase();

  let results = gameList.filter(game => {
    const searchableText = [
      game.name,
      game.category || "",
      game.description || ""
    ].join(" ").toLowerCase();

    const categoryMatches =
      !category.value ||
      (game.category || "Other") === category.value;

    return searchableText.includes(query) && categoryMatches;
  });

  if (sort.value === "az") {
    results.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sort.value === "za") {
    results.sort((a, b) => b.name.localeCompare(a.name));
  }

  grid.replaceChildren();

  count.textContent =
    `${results.length} game${results.length === 1 ? "" : "s"} found`;

  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No games found. Try another search.";
    grid.appendChild(empty);
    return;
  }

  for (const game of results) {
    const card = document.createElement("article");
    card.className = "game";

    /* Icon */

    const icon = document.createElement("div");
    icon.className = "icon";

    if (game.icon) {
      const img = document.createElement("img");
      img.src = game.icon;
      img.alt = "";
      img.loading = "lazy";

      img.onerror = () => {
        img.remove();
        icon.textContent = makeInitials(game.name);
      };

      icon.appendChild(img);
    } else {
      icon.textContent = makeInitials(game.name);
    }

    /* Name */

    const title = document.createElement("h2");
    title.textContent = game.name;

    /* Description */

    const description = document.createElement("p");
    description.textContent =
      game.description || game.category || "Game";

    /* Buttons */

    const actions = document.createElement("div");
    actions.className = "game-actions";

    const playButton = document.createElement("button");
    playButton.type = "button";
    playButton.textContent = "Play";
    playButton.addEventListener("click", () => openGame(game));

    const blankButton = document.createElement("button");
    blankButton.type = "button";
    blankButton.textContent = "about:blank";
    blankButton.title = "Open in a blank tab";
    blankButton.addEventListener(
      "click",
      () => openGameInBlankTab(game)
    );

    actions.append(playButton, blankButton);
    card.append(icon, title, description, actions);
    grid.appendChild(card);
  }
}

/* Panic overlay */

function activatePanic() {
  if (!panicOverlay.hidden) return;

  let url;

  try {
    url = new URL(PANIC_SITE);

    if (!["http:", "https:"].includes(url.protocol)) {
      return;
    }
  } catch {
    alert("The panic website URL is invalid.");
    return;
  }

  panicFrame.src = url.href;
  panicOverlay.hidden = false;
}

function deactivatePanic() {
  panicOverlay.hidden = true;
  panicFrame.src = "about:blank";
}

/* Keyboard shortcuts */

document.addEventListener("keydown", event => {
  const target = event.target;

  const typing =
    target instanceof HTMLElement &&
    (
      target.isContentEditable ||
      ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName)
    );

  if (
    typing ||
    event.ctrlKey ||
    event.altKey ||
    event.metaKey ||
    event.repeat
  ) {
    return;
  }

  if (event.key === PANIC_KEY) {
    event.preventDefault();
    activatePanic();
    return;
  }

  if (event.key === "Escape") {
    if (!panicOverlay.hidden) {
      deactivatePanic();
    } else if (!player.hidden) {
      closeGame();
    }
  }
});

/* Player controls */

document.getElementById("backButton")
  .addEventListener("click", closeGame);

document.getElementById("newTabButton")
  .addEventListener("click", () => {
    if (currentGame) {
      openGameInBlankTab(currentGame);
    }
  });

/* Search, category and sorting */

search.addEventListener("input", renderGames);
category.addEventListener("change", renderGames);
sort.addEventListener("change", renderGames);

/* Initialize */

createCategories();
renderGames();
</script>

</body>
</html>
