
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07150f">
  <title>COCONUT</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07150f;
      color: #8fffc9;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: min(520px, 92vw);
      padding: 28px;
      border: 1px solid #3aff9f66;
      border-radius: 18px;
      background: #0d2119;
      box-shadow: 0 12px 40px #0008;
      text-align: center;
    }

    h1 { margin: 0 0 10px; font-size: 2rem; }
    p { margin: 0 0 18px; opacity: .9; }

    button {
      height: 48px;
      padding: 0 26px;
      border: 0;
      border-radius: 999px;
      background: #2dff98;
      color: #032114;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    .link {
      display: block;
      margin-top: 14px;
      color: #8fffc9;
    }

    #status {
      margin-top: 16px;
      font-size: .85rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 id="site-title">COCONUT</h1>
    <p id="site-description">Launch games in cloak mode</p>

    <button id="launch" type="button">Launch</button>

    <a class="link" href="/games/lessons.html">
      Open without cloak
    </a>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const launchButton = document.getElementById("launch");
    const status = document.getElementById("status");

    let lessonsPath = "/games/lessons.html";

    // Load public configuration from Cloudflare D1.
    async function loadConfig() {
      try {
        const response = await fetch("/api/config", {
          headers: { Accept: "application/json" }
        });

        if (!response.ok) throw new Error("Config unavailable");

        const config = await response.json();

        if (typeof config.title === "string") {
          document.getElementById("site-title").textContent =
            config.title;
          document.title = config.title;
        }

        if (typeof config.description === "string") {
          document.getElementById("site-description").textContent =
            config.description;
        }

        // Only accept local paths, not arbitrary external URLs.
        if (
          typeof config.lessonsPath === "string" &&
          config.lessonsPath.startsWith("/") &&
          !config.lessonsPath.startsWith("//")
        ) {
          lessonsPath = config.lessonsPath;
        }
      } catch {
        // The default settings still work if the API is unavailable.
      }
    }

    launchButton.addEventListener("click", () => {
      const target = new URL(lessonsPath, location.origin);

      if (target.origin !== location.origin) {
        status.textContent = "Invalid destination.";
        return;
      }

      // Open synchronously during the click to avoid popup blockers.
      const win = window.open("about:blank", "_blank");

      if (!win) {
        status.textContent = "Allow popups to launch cloak mode.";
        return;
      }

      // Use DOM APIs instead of inserting dynamic HTML with document.write.
      win.document.title = "Classes";
      win.document.documentElement.style.cssText =
        "height:100%;background:#000";
      win.document.body.style.cssText =
        "margin:0;height:100%;background:#000";

      const frame = win.document.createElement("iframe");
      frame.src = target.href;
      frame.title = "Classes";
      frame.allowFullscreen = true;
      frame.style.cssText =
        "display:block;border:0;width:100%;height:100%";

      win.document.body.appendChild(frame);

      // Keep the original tab on COCONUT.
      // This avoids silently redirecting the original tab.
    });

    loadConfig();
  </script>
</body>
</html>
